<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afifah &amp; Haziq — Wedding POV</title>
    <meta name="description" content="Share your wedding POV — upload photos and videos to Afifah & Haziq's wedding wall.">
    <link rel="canonical" href="https://ajiqnomoto.github.io/povkita/">
    <meta property="og:title" content="Afifah & Haziq — Wedding POV">
    <meta property="og:description" content="Share your wedding POV — upload photos and videos to the wedding wall.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ajiqnomoto.github.io/povkita/">
    <meta name="twitter:card" content="summary">
    <meta name="theme-color" content="#0f0f0f">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%230f0f0f'/%3E%3Cpath fill='white' d='M8.2 6.5 9 5.3a2 2 0 0 1 1.65-.88h2.7A2 2 0 0 1 15 5.3l.8 1.2H18a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.2Z'/%3E%3Ccircle cx='12' cy='12.5' r='3.4' fill='none' stroke='white' stroke-width='1.8'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://lh3.googleusercontent.com">
    <link rel="preconnect" href="https://script.google.com" crossorigin>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0f0f0f;
            color: white;
            font-family: 'Helvetica Neue', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .site-header {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 40;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            padding: 24px; text-align: center;
        }
        .site-title {
            margin: 0; font-size: 1.25rem; font-weight: 700;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: rgba(255,255,255,0.9);
        }
        .site-sub { margin: 4px 0 0; font-size: 0.75rem; color: #9ca3af; }

        .masonry-grid { column-count: 2; column-gap: 10px; padding: 10px; padding-top: 96px; padding-bottom: 128px; }
        .masonry-item { break-inside: avoid; margin-bottom: 10px; border-radius: 12px; overflow: hidden; position: relative; transition: opacity 0.5s; }
        .masonry-item.dimmed { opacity: 0.5; }
        .masonry-item img, .masonry-item video { width: 100%; display: block; }
        .media-placeholder {
            display: flex; align-items: center; justify-content: center;
            min-height: 120px; background: rgba(255,255,255,0.04);
            color: #9ca3af; font-size: 12px;
        }

        .gallery-msg { column-span: all; text-align: center; padding: 40px 0; margin: 0; }
        .msg-empty { color: #9ca3af; }
        .msg-error { color: #f87171; }
        .gallery-loading {
            column-span: all; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 40px 0; opacity: 0.5;
        }
        .gallery-loading-text { margin: 0; font-size: 12px; }

        .upload-btn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 70px; background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(255,255,255,0.3); z-index: 50; border: 4px solid rgba(255,255,255,0.3);
            transition: all 0.2s; cursor: pointer;
        }
        .upload-btn:active { transform: translateX(-50%) scale(0.95); }
        .upload-btn svg { color: #000; }
        /* Disabled state for button */
        .upload-btn.disabled { opacity: 0.5; pointer-events: none; background: #ccc; }

        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #000; border-radius: 50%; width: 20px; height: 20px; margin-bottom: 8px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .status-box {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8); padding: 16px 24px; border-radius: 12px;
            display: none; flex-direction: column; align-items: center;
            z-index: 50; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1); max-width: min(84vw, 340px);
        }
        .status-box.visible { display: flex; }
        .status-text { font-size: 0.875rem; font-weight: 500; text-align: center; }

        .retry-btn {
            margin-top: 12px; padding: 6px 18px; font-size: 13px; font-weight: 500;
            color: #fff; background: transparent; border: 1px solid rgba(255,255,255,0.4);
            border-radius: 8px; cursor: pointer;
        }
        .retry-btn:active { transform: scale(0.97); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="site-header">
        <h1 class="site-title">AFIFAH &amp; HAZIQ</h1>
        <p class="site-sub">Share your wedding POV</p>
    </div>

    <div class="masonry-grid" id="gallery">
    </div>

    <label class="upload-btn" id="uploadBtnLabel" aria-label="Upload a photo or video">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8.2 6.5 9 5.3a2 2 0 0 1 1.65-.88h2.7A2 2 0 0 1 15 5.3l.8 1.2H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h2.2Z"/>
            <circle cx="12" cy="13" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
        <input type="file" id="fileInput" name="file" accept="image/*,video/*" class="hidden">
    </label>

    <div id="status" class="status-box" role="status" aria-live="polite">
        <div id="spinner" class="loader"></div>
        <span id="statusText" class="status-text">Compressing &amp; Uploading...</span>
        <button id="retryBtn" class="retry-btn hidden" type="button">Retry</button>
    </div>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbyGnBaQldx7C1UWHBa6QxJz3YyXer_3aXpPqJRPhAWEDdtmBg85LeMbCMSmA94AtwfU/exec";
        const ALLOWED_MEDIA_HOST = 'lh3.googleusercontent.com';

        const fileInput = document.getElementById('fileInput');
        const uploadBtnLabel = document.getElementById('uploadBtnLabel');
        const statusDiv = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const spinner = document.getElementById('spinner');
        const retryBtn = document.getElementById('retryBtn');
        const gallery = document.getElementById('gallery');

        let lastFailedPayload = null;
        let activePreview = null;

        // --- 1. Gallery loading ---
        function isAllowedMediaUrl(urlStr, allowBlob) {
            try {
                const parsed = new URL(urlStr);
                if (parsed.protocol === 'blob:') return !!allowBlob; // local upload preview only
                return parsed.protocol === 'https:' && parsed.hostname === ALLOWED_MEDIA_HOST;
            } catch (err) {
                return false;
            }
        }

        function showMediaPlaceholder(div) {
            div.textContent = '';
            div.classList.add('media-placeholder');
            const span = document.createElement('span');
            span.textContent = 'Media unavailable';
            div.appendChild(span);
        }

        function addToGallery(url, type, isNew = true) {
            if (!isAllowedMediaUrl(url, isNew)) {
                console.warn('Skipped media with disallowed URL:', url);
                return null;
            }
            const isVideo = typeof type === 'string' && type.startsWith('video/');
            const div = document.createElement('div');
            div.className = isNew ? 'masonry-item dimmed' : 'masonry-item';

            let media;
            if (isVideo) {
                media = document.createElement('video');
                media.controls = true;
                media.playsInline = true;
                media.preload = 'metadata';
            } else {
                media = document.createElement('img');
                media.loading = 'lazy';
                media.alt = 'Wedding Snap';
            }
            media.src = url;
            media.addEventListener('error', function () { showMediaPlaceholder(div); }, { once: true });
            div.appendChild(media);
            gallery.prepend(div);
            return div;
        }

        async function fetchGallery() {
            gallery.innerHTML = '<div class="gallery-loading"><div class="loader"></div><p class="gallery-loading-text">Loading photos...</p></div>';
            try {
                const response = await fetch(scriptURL);
                const data = await response.json();
                gallery.innerHTML = ''; // Clear the loader
                if (!Array.isArray(data) || data.length === 0) {
                    gallery.innerHTML = '<p class="gallery-msg msg-empty">No photos yet. Be the first!</p>';
                    return;
                }
                data.forEach(function (item) {
                    addToGallery(item.url, item.type, false);
                });
            } catch (error) {
                console.error('Error loading gallery:', error);
                gallery.innerHTML = '';
                const msg = document.createElement('p');
                msg.className = 'gallery-msg msg-error';
                msg.textContent = 'Failed to load photos.';
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'retry-btn';
                btn.textContent = 'Retry';
                btn.addEventListener('click', fetchGallery);
                msg.appendChild(document.createElement('br'));
                msg.appendChild(btn);
                gallery.appendChild(msg);
            }
        }

        // --- 2. Upload status UI ---
        function showStatus(text) {
            statusText.textContent = text;
            spinner.style.display = '';
            retryBtn.classList.add('hidden');
            statusDiv.classList.add('visible');
        }

        function showError(text, retryable) {
            statusText.textContent = text;
            spinner.style.display = 'none';
            retryBtn.classList.toggle('hidden', !retryable);
            statusDiv.classList.add('visible');
        }

        function hideStatus() {
            statusDiv.classList.remove('visible');
            spinner.style.display = '';
            retryBtn.classList.add('hidden');
        }

        function finishSuccess(message, pauseMs, undimPreview) {
            if (activePreview && undimPreview) activePreview.classList.remove('dimmed');
            statusText.textContent = message;
            spinner.style.display = 'none';
            retryBtn.classList.add('hidden');
            setTimeout(function () {
                hideStatus();
                uploadBtnLabel.classList.remove('disabled');
                activePreview = null;
            }, pauseMs);
        }

        // --- 3. Upload send ---
        // Try a normal CORS POST first (gives us a readable status). If CORS/network
        // blocks it, fall back to no-cors: delivery still works but the response is
        // opaque, so the UI can only say "sent" instead of "saved".
        async function sendUpload(payload) {
            const body = JSON.stringify(payload);
            try {
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: body
                });
                // The server answered: trust its status and never blind-retry
                // (a retry here could post the same photo twice).
                return response.ok ? 'cors' : null;
            } catch (corsError) {
                try {
                    await fetch(scriptURL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: body
                    });
                    return 'no-cors';
                } catch (noCorsError) {
                    console.error('Upload failed:', noCorsError);
                    return null;
                }
            }
        }

        async function attemptSend(payload) {
            lastFailedPayload = payload;
            uploadBtnLabel.classList.add('disabled');
            showStatus('Sending...');
            const result = await sendUpload(payload);
            if (result === 'cors') {
                lastFailedPayload = null;
                finishSuccess('Saved! 🎉', 2000, true);
            } else if (result === 'no-cors') {
                lastFailedPayload = null;
                // Preview stays dimmed until it shows up in the refreshed gallery.
                finishSuccess('Upload sent — if it doesn’t appear within a minute, please try again.', 4000, false);
            } else {
                if (activePreview) {
                    activePreview.remove();
                    activePreview = null;
                }
                showError('Upload failed — please check your connection and try again.', true);
                uploadBtnLabel.classList.remove('disabled');
            }
        }

        retryBtn.addEventListener('click', function () {
            if (lastFailedPayload) {
                attemptSend(lastFailedPayload);
            } else {
                hideStatus();
            }
        });

        // --- 4. File selection ---
        fileInput.addEventListener('change', async function (e) {
            const file = e.target.files && e.target.files[0];
            fileInput.value = ''; // allow re-picking the same file
            if (!file) return;

            uploadBtnLabel.classList.add('disabled');
            showStatus('Processing...');

            // Show local preview immediately
            const objectUrl = URL.createObjectURL(file);
            const previewDiv = addToGallery(objectUrl, file.type, true);
            activePreview = previewDiv;

            let payload = null;
            try {
                if (file.type.startsWith('image')) {
                    statusText.textContent = 'Compressing...';
                    const compressedDataUrl = await compressImage(file);
                    payload = { base64: compressedDataUrl.split(',')[1], type: 'image/jpeg', name: 'snap_' + Date.now() + '.jpg' };
                } else {
                    if (file.size > 50 * 1024 * 1024) throw new Error('Video too large! Max 50MB.');
                    statusText.textContent = 'Uploading video...';
                    payload = { base64: await toBase64(file), type: file.type, name: file.name };
                }
            } catch (err) {
                console.error(err);
                if (previewDiv) {
                    previewDiv.remove();
                    URL.revokeObjectURL(objectUrl);
                }
                activePreview = null;
                showError('Upload failed: ' + err.message, false);
                uploadBtnLabel.classList.remove('disabled');
                return;
            }

            attemptSend(payload);
        });

        // --- Helper Functions ---
        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const maxWidth = 1024;
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        // Load the gallery as soon as the DOM is parsed.
        fetchGallery();
    </script>
</body>
</html>
