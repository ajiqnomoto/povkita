<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding POV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f0f0f; color: white; font-family: 'Helvetica Neue', sans-serif; -webkit-tap-highlight-color: transparent; }
        .masonry-grid { column-count: 2; column-gap: 10px; padding: 10px; }
        .masonry-item { break-inside: avoid; margin-bottom: 10px; border-radius: 12px; overflow: hidden; position: relative; }
        .masonry-item img, .masonry-item video { width: 100%; display: block; }
        
        .upload-btn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 70px; background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(255,255,255,0.3); z-index: 50; border: 4px solid rgba(255,255,255,0.3);
            transition: all 0.2s;
        }
        .upload-btn:active { transform: translateX(-50%) scale(0.95); }
        
        /* Disabled state for button */
        .upload-btn.disabled { opacity: 0.5; pointer-events: none; background: #ccc; }

        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #000; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="fixed top-0 w-full z-40 bg-gradient-to-b from-black/80 to-transparent p-6 text-center">
        <h1 class="text-xl font-bold tracking-widest uppercase text-white/90">AFIFAH & HAZIQ</h1>
        <p class="text-xs text-gray-400 mt-1">Share your wedding POV</p>
    </div>

    <div class="masonry-grid pt-24 pb-32" id="gallery">
    </div>

    <form id="uploadForm">
        <label class="upload-btn" id="uploadBtnLabel">
            <i class="fas fa-camera text-black text-2xl"></i>
            <input type="file" id="fileInput" name="file" accept="image/*,video/*" class="hidden">
        </label>
    </form>

    <div id="status" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/80 px-6 py-4 rounded-xl hidden flex-col items-center z-50 backdrop-blur-md border border-white/10">
        <div id="spinner" class="loader mb-2"></div>
        <span id="statusText" class="text-sm font-medium">Compressing & Uploading...</span>
    </div>

    <script>
        // REPLACE WITH YOUR NEW WORKING URL
        const scriptURL = "https://script.google.com/macros/s/AKfycbyGnBaQldx7C1UWHBa6QxJz3YyXer_3aXpPqJRPhAWEDdtmBg85LeMbCMSmA94AtwfU/exec"; 
        
        const fileInput = document.getElementById('fileInput');
        const uploadBtnLabel = document.getElementById('uploadBtnLabel');
        const statusDiv = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const gallery = document.getElementById('gallery');

        // --- 1. NEW: Load Gallery on Startup ---
        window.onload = function() {
            fetchGallery();
        };

async function fetchGallery() {
    // 1. Show a loading state inside the gallery immediately
    gallery.innerHTML = `
        <div class="col-span-2 flex flex-col items-center justify-center py-10 opacity-50">
            <div class="loader mb-2"></div>
            <p class="text-xs">Loading photos...</p>
        </div>`;

    try {
        const response = await fetch(scriptURL);
        const data = await response.json();
        
        gallery.innerHTML = ''; // Clear the loader

        if (data.length === 0) {
            gallery.innerHTML = '<p class="col-span-2 text-center text-gray-500 py-10">No photos yet. Be the first!</p>';
            return;
        }

        data.forEach(item => {
            addToGallery(item.url, item.type, false);
        });

    } catch (error) {
        console.error("Error loading gallery:", error);
        gallery.innerHTML = '<p class="col-span-2 text-center text-red-400 py-10">Failed to load photos.</p>';
    }
}

        function addToGallery(url, type, isNew = true) {
            const div = document.createElement('div');
            // If it's new, we dim it initially. If it's from load, we show it fully.
            div.className = isNew ? 'masonry-item opacity-50 transition-opacity duration-500' : 'masonry-item'; 
            
            if (type.startsWith('video')) {
                div.innerHTML = `<video src="${url}" controls playsinline preload="metadata"></video>`;
            } else {
                div.innerHTML = `<img src="${url}" loading="lazy" alt="Wedding Snap">`;
            }
            gallery.prepend(div);
            return div;
        }

        // --- 2. EXISTING: File Upload Logic ---
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            uploadBtnLabel.classList.add('disabled');
            statusDiv.classList.remove('hidden');
            statusDiv.classList.add('flex');
            statusText.innerText = "Processing...";

            // Show local preview immediately
            const objectUrl = URL.createObjectURL(file);
            const previewDiv = addToGallery(objectUrl, file.type, true);

            try {
                let payload = {};
                if (file.type.startsWith('image')) {
                    statusText.innerText = "Compressing...";
                    const compressedDataUrl = await compressImage(file);
                    payload = { base64: compressedDataUrl.split(',')[1], type: 'image/jpeg', name: 'snap_' + Date.now() + '.jpg' };
                } else {
                    if (file.size > 50 * 1024 * 1024) throw new Error("Video too large! Max 50MB.");
                    statusText.innerText = "Uploading Video...";
                    const base64 = await toBase64(file);
                    payload = { base64: base64, type: file.type, name: file.name };
                }

                statusText.innerText = "Sending...";
                
                // We use 'no-cors' for upload, but we can't read the response JSON in 'no-cors' mode.
                // However, since we showed the preview, we just assume success if no error is thrown.
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                previewDiv.classList.remove('opacity-50'); 
                statusText.innerText = "Saved! 🎉";
                setTimeout(() => {
                    statusDiv.classList.add('hidden');
                    statusDiv.classList.remove('flex');
                    uploadBtnLabel.classList.remove('disabled');
                }, 2000);

            } catch (error) {
                console.error(error);
                alert("Upload failed: " + error.message);
                previewDiv.remove();
                statusDiv.classList.add('hidden');
                statusDiv.classList.remove('flex');
                uploadBtnLabel.classList.remove('disabled');
            }
        });

        // --- Helper Functions (Same as before) ---
        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const maxWidth = 1024; 
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
